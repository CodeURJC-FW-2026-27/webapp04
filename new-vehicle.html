<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" /> <!--Special characters-->
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" /> <!--Responsive-->
        <meta name="description" content="Panel de administración de IJAM Motors para dar de alta nuevos vehículos en el catálogo de stock." /> <!--Page description-->
        <meta name="author" content="Alejandro" /> <!--Author-->
        <title>Añadir vehículo - IJAM Motors</title> <!--Tab title-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" /> <!--Tab logo-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /> <!-- Bootstrap icons-->
        <link href="css/styles.css" rel="stylesheet" /> <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/custom.css" rel="stylesheet" /> <!-- Custom IJAM Motors styles-->
    </head>
    <body class="d-flex flex-column h-100"> <!--So that the footer stays at the end and the page looks organized-->
        <main class="flex-shrink-0"> <!--So that the page does not shift-->
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark"> <!--Navbar and colors-->
                <div class="container px-5"> <!--Centers navbar content-->
                    <a class="navbar-brand" href="index.html">IJAM Motors</a> <!--Navbar brand and it redirects you to the index if you click it-->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button> <!--Toggling button for mobile devices-->
                    <div class="collapse navbar-collapse" id="navbarSupportedContent"> <!--Mobile devices-->
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0"> <!--List of navbar items-->
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link active" aria-current="page" href="new-vehicle.html">Añadir vehículo</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Page content-->
            <section class="py-5">
                <div class="container px-5 my-5">
                    <!-- Page header: title and description of the form-->
                    <div class="text-center mb-5">
                        <h1 class="fw-bolder">Añadir nuevo vehículo</h1>
                        <p class="lead fw-normal text-muted mb-0">Complete el formulario para añadir un nuevo vehículo al catálogo.</p>
                    </div>
                    <!-- Vehicle form (same layout as the offer form of the detail page)-->
                    <div class="row gx-5 justify-content-center">
                        <div class="col-lg-8">
                            <div class="bg-light rounded-3 p-4 p-md-5">
                                <form id="vehicleForm" method="post" enctype="multipart/form-data">
                                    <div class="row g-3">
                                        <!-- Brand-->
                                        <div class="col-md-6">
                                            <label class="form-label" for="brand">Marca</label>
                                            <input class="form-control" id="brand" name="brand" type="text" placeholder="Ej. Audi" required />
                                        </div>
                                        <!-- Model-->
                                        <div class="col-md-6">
                                            <label class="form-label" for="model">Modelo</label>
                                            <input class="form-control" id="model" name="model" type="text" placeholder="Ej. A3" required />
                                        </div>
                                        <!-- Model year-->
                                        <div class="col-md-6">
                                            <label class="form-label" for="year">Año</label>
                                            <input class="form-control" id="year" name="year" type="number" placeholder="Ej. 2020" required />
                                        </div>
                                        <!-- Lowest price among its offers-->
                                        <div class="col-md-6">
                                            <label class="form-label" for="lowestPrice">Precio más bajo (€)</label>
                                            <input class="form-control" id="lowestPrice" name="lowestPrice" type="number" placeholder="Ej. 20000" required />
                                        </div>
                                        <!-- Fuel type (same values as the catalog filters)-->
                                        <div class="col-md-6">
                                            <label class="form-label" for="fuelType">Combustible</label>
                                            <select class="form-select" id="fuelType" name="fuelType" required>
                                                <option value="" selected disabled>Selecciona una opción</option>
                                                <option value="gasoline">Gasolina</option>
                                                <option value="diesel">Diésel</option>
                                                <option value="hybrid">Híbrido</option>
                                                <option value="electric">Eléctrico</option>
                                            </select>
                                        </div>
                                        <!-- Body type (same values as the catalog categories)-->
                                        <div class="col-md-6">
                                            <label class="form-label" for="bodyType">Carrocería</label>
                                            <select class="form-select" id="bodyType" name="bodyType" required>
                                                <option value="" selected disabled>Selecciona una opción</option>
                                                <option value="suv">SUV</option>
                                                <option value="sedan">Berlina</option>
                                                <option value="compact">Compacto</option>
                                                <option value="coupe">Coupé</option>
                                            </select>
                                        </div>
                                        <!-- Image or images of the vehicle-->
                                        <div class="col-12">
                                            <label class="form-label" for="image">Imágenes del vehículo</label>
                                            <input class="form-control" id="image" name="image" type="file" accept="image/*" multiple />
                                        </div>
                                        <!-- Form buttons: save and cancel-->
                                        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                            <a class="btn btn-outline-secondary px-4" href="index.html">Cancelar</a>
                                            <button class="btn btn-primary px-4" type="submit">Guardar</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer-->
        <footer class="bg-dark py-4 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                    <div class="col-auto"><div class="small m-0 text-white">Copyright &copy; IJAM MOTORS 2026</div></div>
                    <div class="col-auto">
                        <a class="link-light small" href="#!">Privacidad</a>
                        <span class="text-white mx-1">&middot;</span>
                        <a class="link-light small" href="#!">Términos</a>
                        <span class="text-white mx-1">&middot;</span>
                        <a class="link-light small" href="#!">Contacto</a>
                    </div>
                </div>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
