    <!-- Car outline: cabin and body -->
    <g fill="none" stroke="#adb5bd" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M265 255 L292 192 Q302 170 327 170 L473 170 Q498 170 508 192 L535 255"/>
        <rect x="220" y="255" width="360" height="70" rx="22"/>
