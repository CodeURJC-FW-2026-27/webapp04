    <!-- Wheels -->
    <circle cx="305" cy="328" r="30" fill="#adb5bd"/>
    <circle cx="495" cy="328" r="30" fill="#adb5bd"/>
    <text x="400" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#6c757d">Sin imagen</text>
</svg>
