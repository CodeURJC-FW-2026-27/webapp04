<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Confirmación de alta de vehículo en IJAM Motors." />
        <meta name="author" content="Alejandro" />
        <title>Vehículo creado - IJAM Motors</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="/css/styles.css" rel="stylesheet" />
        <link href="/css/custom.css" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand fw-bold" href="/">IJAM Motors</a>
            </div>
        </nav>

        <!-- Message -->
        <main class="container my-auto py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0 text-center p-4 p-md-5">
                        <div class="mb-3 text-success">
                            <i class="bi bi-check-circle-fill" style="font-size: 3.5rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-3">¡Vehículo añadido al catálogo!</h2>
                        <p class="text-muted mb-4">
                            El vehículo se ha guardado correctamente en la base de datos de IJAM Motors.
                        </p>
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                            <a href="/vehicle/{{id}}" class="btn btn-dark px-4">
                                <i class="bi bi-eye me-1"></i> Ver detalle del vehículo
                            </a>
                            <a href="/" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-arrow-left me-1"></i> Volver al inicio
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-4 bg-dark mt-auto">
            <div class="container">
                <p class="m-0 text-center text-white">Copyright &copy; IJAM Motors 2026</p>
            </div>
        </footer>
    </body>
</html>
