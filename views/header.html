<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>{{pageTitle}} - IJAM Motors</title> <!--Each route sends its own page title-->
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" /> <!-- Bootstrap icons-->
        <link href="/css/styles.css" rel="stylesheet" /> <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/custom.css" rel="stylesheet" /> <!-- Custom IJAM Motors styles-->
    </head>
    <!-- Flexbox column at least as tall as the screen, so the footer (mt-auto) stays at the bottom-->
    <body class="d-flex flex-column min-vh-100">
        <!-- Navigation (the router marks the current page with navHome or navNewVehicle)-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark"> <!--Navbar and its colors-->
            <div class="container px-5"> <!--Centers the navbar content-->
                <a class="navbar-brand" href="/">IJAM Motors</a> <!--Navbar brand, links to the home page when clicked-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button> <!--Toggle button for mobile devices-->
                <div class="collapse navbar-collapse" id="navbarSupportedContent"> <!--Collapsible menu on mobile devices-->
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0"> <!--List of navbar items-->
                        <li class="nav-item"><a class="nav-link{{#navHome}} active{{/navHome}}" {{#navHome}}aria-current="page" {{/navHome}}href="/">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link{{#navNewVehicle}} active{{/navNewVehicle}}" {{#navNewVehicle}}aria-current="page" {{/navNewVehicle}}href="/vehicle/new">Añadir vehículo</a></li>
                    </ul>
                </div>
            </div>
        </nav>
