<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Error - IJAM Motors</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="/css/styles.css" rel="stylesheet" />
        <link href="/css/custom.css" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand fw-bold" href="/">IJAM Motors</a>
            </div>
        </nav>

        <main class="container my-auto py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0 text-center p-4 p-md-5">
                        <div class="mb-3 text-danger">
                            <i class="bi bi-exclamation-triangle-fill" style="font-size: 3.5rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-3">Ha ocurrido un error</h2>
                        <p class="text-muted mb-4">{{errorMessage}}</p>
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                            <a href="{{redirectUrl}}" class="btn btn-dark px-4">
                                <i class="bi bi-arrow-left me-1"></i> {{buttonText}}
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="py-4 bg-dark mt-auto">
            <div class="container">
                <p class="m-0 text-center text-white">Copyright © IJAM Motors 2026</p>
            </div>
        </footer>
    </body>
</html>
